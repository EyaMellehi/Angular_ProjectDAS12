<h1>List des Conferences </h1>
<div class="container-fluid d-flex flex-wrap justify-content-center">
    @for (conf of confList; track conf.id) {
        @if(conf.nbPlaces > 0) {
            <div class="card" style="width: 18rem;">
            <img class="card-img-top" src={{conf.imageUrl}} alt="conf_image">
            <div class="card-body">
                <h5 class="card-title">{{conf.titre | uppercase}}</h5>
                <p class="card-text">{{conf.description}}</p>
                <a href="#" class="btn btn-primary">Add to favorites</a>
            </div>
            </div>
        }
    }@empty {
        <h2>Pas de conferences  </h2>
    }
</div>
