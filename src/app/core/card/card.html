<div class="card" style="width: 18rem;">
            <img class="card-img-top" src={{conf.imageUrl}} alt="conf_image">
            <div class="card-body">
                <h5 class="card-title">{{conf.titre | uppercase}}</h5>
                <p class="card-text">date: {{conf.date | date: "dd/mm/yyyy"}}</p>
                <p class="card-text">{{conf.category}}</p>
                <a href="#" class="btn btn-primary" (click)="addToFavorites(conf)">Add to favorites</a>
                 <a href="#" class="btn btn-primary" (click)="addLike(conf)">Like ({{conf.nbLikes}})</a>
            </div>
            <h1>Signal value: {{x()}}</h1>
</div>
